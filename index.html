<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Last Stand: AP — Tactical FPS</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050a0d;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #e8f3f6;
  }

  #game-root {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060d11;
  }

  #three-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 2;
  }

  #cinematic-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(3, 7, 10, 0.78) 100%);
  }

  /* HUD Superior */
  .hud-top-left {
    position: absolute;
    top: 10px;
    left: 14px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.96);
    display: none;
  }

  .hud-zone {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: rgba(218, 240, 246, 0.96);
    text-transform: uppercase;
  }

  .hud-bar-track {
    width: 112px;
    height: 4px;
    background: rgba(255, 255, 255, 0.16);
    margin-top: 4px;
    border-radius: 2px;
    overflow: hidden;
  }

  .hud-bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.12s linear;
  }

  #barricade-fill { background: linear-gradient(90deg, #2ca89b, #57e2d3); }
  #morale-fill { background: linear-gradient(90deg, #c9551e, #f28a42); }

  .hud-top-right {
    position: absolute;
    top: 10px;
    right: 14px;
    z-index: 5;
    pointer-events: none;
    text-align: right;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.96);
    display: none;
  }

  .hud-day {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: #f2f8fa;
  }

  .hud-sub {
    font-size: 10px;
    font-weight: 700;
    color: rgba(214, 232, 238, 0.88);
    margin-top: 2px;
  }

  .hud-top-right .hud-bar-track {
    margin-left: auto;
    width: 96px;
  }

  /* Joystick Izquierdo: Moverse */
  #move-pad {
    position: absolute;
    left: 16px;
    bottom: 64px;
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: rgba(10, 20, 26, 0.36);
    border: 1px solid rgba(150, 224, 232, 0.28);
    z-index: 6;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #move-knob {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(126, 224, 232, 0.48);
    border: 1px solid rgba(225, 250, 255, 0.78);
    pointer-events: none;
  }

  /* Joystick Derecho: Girar Cámara */
  #look-pad {
    position: absolute;
    right: 18px;
    bottom: 84px;
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: rgba(10, 20, 26, 0.34);
    border: 1px solid rgba(242, 138, 66, 0.32);
    z-index: 6;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #look-knob {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(242, 138, 66, 0.45);
    border: 1px solid rgba(255, 235, 215, 0.78);
    pointer-events: none;
  }

  /* HUD Inferior Derecho: Munición + Botones */
  .hud-bottom-bar {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 12px;
    z-index: 7;
    display: none;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
  }

  .ammo-readout {
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.96);
  }

  .ammo-weapon {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.1px;
    color: #66ddd0;
  }

  .ammo-count {
    font-size: 16px;
    font-weight: 900;
    color: #f6fbfd;
  }

  .action-cluster {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }

  .tiny-btn {
    height: 40px;
    padding: 0 11px;
    border-radius: 20px;
    border: 1px solid rgba(160, 224, 232, 0.28);
    background: rgba(9, 17, 22, 0.65);
    color: #eaf6f9;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.7px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .tiny-btn.fire-btn {
    background: rgba(196, 78, 28, 0.55);
    border-color: rgba(255, 152, 92, 0.55);
  }

  .tiny-btn:active {
    transform: scale(0.93);
  }

  .gameplay-active .hud-top-left,
  .gameplay-active .hud-top-right,
  .gameplay-active #move-pad,
  .gameplay-active #look-pad,
  .gameplay-active .hud-bottom-bar {
    display: flex;
  }

  .gameplay-active .hud-top-left,
  .gameplay-active .hud-top-right {
    display: block;
  }

  #center-banner {
    position: absolute;
    top: 16%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    pointer-events: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e4faf7;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.98);
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
  }

  /* Menú Principal */
  #main-menu {
    position: absolute;
    inset: 0;
    z-index: 12;
    background: radial-gradient(circle at 50% 42%, rgba(30, 82, 92, 0.34), rgba(4, 8, 11, 0.94) 74%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
  }

  #main-menu.hidden { display: none; }

  .menu-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #eff8fa;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.96);
  }

  .menu-sub {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(118, 222, 212, 0.92);
    margin-bottom: 4px;
    text-transform: uppercase;
    text-align: center;
  }

  .menu-btn {
    width: 224px;
    padding: 11px 18px;
    border-radius: 6px;
    border: 1px solid rgba(155, 220, 228, 0.26);
    background: rgba(10, 19, 25, 0.85);
    color: #ebf5f8;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .menu-btn.primary {
    border-color: rgba(88, 222, 206, 0.82);
    background: rgba(24, 118, 112, 0.46);
    color: #effffd;
  }

  /* Opciones */
  #options-panel {
    position: absolute;
    inset: 0;
    z-index: 14;
    background: rgba(4, 8, 12, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
  }

  #options-panel.visible { display: flex; }

  .quality-row {
    display: flex;
    gap: 8px;
  }

  .q-btn {
    padding: 9px 16px;
    border-radius: 5px;
    border: 1px solid rgba(155, 220, 228, 0.25);
    background: rgba(15, 24, 31, 0.9);
    color: #d4e6ec;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    cursor: pointer;
  }

  .q-btn.active {
    border-color: #62dfd2;
    background: rgba(34, 138, 130, 0.52);
    color: #f3ffff;
  }

  .sens-box {
    width: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  .sens-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #bfe8ee;
  }

  input[type="range"] {
    width: 100%;
    accent-color: #57e2d3;
  }

  #end-overlay {
    position: absolute;
    inset: 0;
    z-index: 13;
    background: rgba(4, 8, 11, 0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }

  #end-overlay.visible { display: flex; }

  #end-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #f26856;
  }

  #end-stats {
    font-size: 12px;
    color: rgba(232, 242, 246, 0.92);
    line-height: 1.5;
  }
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="game-root">
  <canvas id="three-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div id="cinematic-vignette"></div>

  <div class="hud-top-left">
    <div class="hud-zone" id="map-label">DÍAS 1–5 · SECTOR DE CONTENCIÓN</div>
    <div class="hud-bar-track"><div id="barricade-fill" class="hud-bar-fill"></div></div>
    <div class="hud-sub" id="barricade-label">PERÍMETRO 100%</div>
  </div>

  <div class="hud-top-right">
    <div class="hud-day" id="day-label">DÍA 1</div>
    <div class="hud-bar-track"><div id="morale-fill" class="hud-bar-fill"></div></div>
    <div class="hud-sub" id="horde-label">HORDA: 100 · BAJAS: 0</div>
  </div>

  <div id="move-pad"><div id="move-knob"></div></div>
  <div id="look-pad"><div id="look-knob"></div></div>

  <div id="center-banner"></div>

  <div class="hud-bottom-bar">
    <div class="ammo-readout">
      <div class="ammo-weapon" id="weapon-name">GLOCK 19 TACTICAL</div>
      <div class="ammo-count" id="ammo-count">17 / ∞</div>
    </div>
    <div class="action-cluster">
      <button class="tiny-btn fire-btn" id="btn-fire" type="button">FUEGO</button>
      <button class="tiny-btn" id="btn-reload" type="button">REC</button>
      <button class="tiny-btn" id="btn-weapon" type="button">ARMA</button>
      <button class="tiny-btn" id="btn-fs-hud" type="button">FS</button>
      <button class="tiny-btn" id="btn-menu-hud" type="button">MENÚ</button>
    </div>
  </div>

  <div id="main-menu">
    <div class="menu-title">THE LAST STAND · AP</div>
    <div class="menu-sub">TACTICAL HORROR FPS · ILUMINACIÓN PBR</div>
    <button class="menu-btn primary" id="btn-new" type="button">NEW</button>
    <button class="menu-btn" id="btn-options" type="button">OPTIONS</button>
    <button class="menu-btn" id="btn-fullscreen" type="button">FULL SCREEN</button>
    <button class="menu-btn" id="btn-exit" type="button">SALIR</button>
  </div>

  <div id="options-panel">
    <div class="menu-title" style="font-size: 18px;">OPTIONS</div>
    <div class="menu-sub">CALIDAD GRÁFICA Y SENSIBILIDAD</div>
    <div class="quality-row">
      <button class="q-btn" data-q="low" type="button">BAJA</button>
      <button class="q-btn" data-q="medium" type="button">MEDIA</button>
      <button class="q-btn" data-q="high" type="button">ALTA</button>
    </div>
    <div class="sens-box">
      <div class="sens-label" id="sens-value-label">SENSIBILIDAD JOYSTICK CÁMARA: 1.0x</div>
      <input id="sens-slider" type="range" min="0.4" max="2.4" step="0.1" value="1.0" />
    </div>
    <button class="menu-btn primary" id="btn-options-back" type="button" style="margin-top: 6px;">GUARDAR Y VOLVER</button>
  </div>

  <div id="end-overlay">
    <div id="end-title">PERÍMETRO SUPERADO</div>
    <div id="end-stats"></div>
    <button class="menu-btn primary" id="retry-btn" type="button">NEW (REINTENTAR)</button>
    <button class="menu-btn" id="end-to-menu" type="button">MENÚ</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     OPCIONAL: Pega aquí una URL de audio o data:audio/mp3;base64,...
     para reproducir tu sonido exacto de Glock al disparar.
     ========================================================= */
  const CUSTOM_GLOCK_SOUND_URL = '';

  const STORAGE_KEY = 'tls_ap_tactical_fps_v2';
  const QUALITY_PRESETS = {
    low:    { pixelRatio: 1.0,  shadows: false, shadowRes: 512,  fogDensity: 0.022, exposure: 1.24, bumpScale: 0.018 },
    medium: { pixelRatio: 1.5,  shadows: true,  shadowRes: 1024, fogDensity: 0.026, exposure: 1.32, bumpScale: 0.032 },
    high:   { pixelRatio: 2.0,  shadows: true,  shadowRes: 2048, fogDensity: 0.030, exposure: 1.38, bumpScale: 0.048 }
  };

  let currentQuality = 'high';
  let lookSensitivity = 1.0;

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.quality && QUALITY_PRESETS[saved.quality]) currentQuality = saved.quality;
    if (typeof saved.sensitivity === 'number') lookSensitivity = saved.sensitivity;
  } catch (_) {}

  /* =========================================================
     AUDIO PROCEDURAL + SOPORTE PARA AUDIO PERSONALIZADO DE GLOCK
     ========================================================= */
  class TacticalAudio {
    constructor() {
      this.ctx = null;
      this.noiseBuffer = null;
      this.started = false;
      this.lastGroan = 0;
      this.customGlockEl = null;
      if (CUSTOM_GLOCK_SOUND_URL) {
        this.customGlockEl = new Audio(CUSTOM_GLOCK_SOUND_URL);
        this.customGlockEl.preload = 'auto';
      }
    }

    unlock() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const len = this.ctx.sampleRate * 2.0;
        this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const ch = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      this.startAmbient();
    }

    startAmbient() {
      if (this.started || !this.ctx || !this.noiseBuffer) return;
      this.started = true;
      const now = this.ctx.currentTime;

      const hum = this.ctx.createOscillator();
      hum.type = 'sawtooth';
      hum.frequency.setValueAtTime(48, now);
      const humLp = this.ctx.createBiquadFilter();
      humLp.type = 'lowpass';
      humLp.frequency.setValueAtTime(100, now);
      const humGain = this.ctx.createGain();
      humGain.gain.setValueAtTime(0.045, now);
      hum.connect(humLp);
      humLp.connect(humGain);
      humGain.connect(this.ctx.destination);
      hum.start(now);
    }

    playGlock() {
      if (this.customGlockEl) {
        try {
          const clone = this.customGlockEl.cloneNode();
          clone.volume = 0.85;
          clone.play().catch(() => {});
          return;
        } catch (_) {}
      }
      if (!this.ctx || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;

      const puff = this.ctx.createBufferSource();
      puff.buffer = this.noiseBuffer;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(1750, now);
      bp.Q.setValueAtTime(1.4, now);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.32, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      puff.connect(bp);
      bp.connect(g);
      g.connect(this.ctx.destination);
      puff.start(now);
      puff.stop(now + 0.09);

      const punch = this.ctx.createOscillator();
      punch.type = 'triangle';
      punch.frequency.setValueAtTime(280, now);
      punch.frequency.exponentialRampToValueAtTime(68, now + 0.055);
      const pg = this.ctx.createGain();
      pg.gain.setValueAtTime(0.28, now);
      pg.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      punch.connect(pg);
      pg.connect(this.ctx.destination);
      punch.start(now);
      punch.stop(now + 0.065);
    }

    playScar() {
      if (!this.ctx || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;

      const blast = this.ctx.createBufferSource();
      blast.buffer = this.noiseBuffer;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(1180, now);
      bp.frequency.exponentialRampToValueAtTime(380, now + 0.16);
      const bg = this.ctx.createGain();
      bg.gain.setValueAtTime(0.42, now);
      bg.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      blast.connect(bp);
      bp.connect(bg);
      bg.connect(this.ctx.destination);
      blast.start(now);
      blast.stop(now + 0.19);
    }

    playReload() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [0, 0.2].forEach((d, idx) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(idx === 0 ? 520 : 810, now + d);
        o.frequency.exponentialRampToValueAtTime(210, now + d + 0.05);
        g.gain.setValueAtTime(0.08, now + d);
        g.gain.exponentialRampToValueAtTime(0.001, now + d + 0.055);
        o.connect(g);
        g.connect(this.ctx.destination);
        o.start(now + d);
        o.stop(now + d + 0.06);
      });
    }

    playHit(headshot) {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(headshot ? 410 : 170, now);
      o.frequency.exponentialRampToValueAtTime(52, now + 0.06);
      g.gain.setValueAtTime(headshot ? 0.15 : 0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      o.connect(g);
      g.connect(this.ctx.destination);
      o.start(now);
      o.stop(now + 0.07);
    }

    playGroan(t) {
      if (!this.ctx || t - this.lastGroan < 3.4) return;
      this.lastGroan = t;
      const now = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sawtooth';
      const f = 68 + Math.random() * 22;
      o.frequency.setValueAtTime(f, now);
      o.frequency.linearRampToValueAtTime(f * 0.72, now + 0.65);
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(240, now);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.065, now + 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      o.connect(lp);
      lp.connect(g);
      g.connect(this.ctx.destination);
      o.start(now);
      o.stop(now + 0.72);
    }
  }

  /* =========================================================
     TEXTURAS PBR DETALLADAS (SUELO REFLECTANTE, PAREDES, PIEL)
     ========================================================= */
  const pbrMaterials = [];

  function createWetIndustrialFloor() {
    const size = 512;
    const albedo = document.createElement('canvas');
    const rough = document.createElement('canvas');
    const bump = document.createElement('canvas');
    albedo.width = rough.width = bump.width = size;
    albedo.height = rough.height = bump.height = size;

    const ag = albedo.getContext('2d');
    const rg = rough.getContext('2d');
    const bg = bump.getContext('2d');

    ag.fillStyle = '#24353c';
    ag.fillRect(0, 0, size, size);
    rg.fillStyle = 'rgb(66,66,66)';
    rg.fillRect(0, 0, size, size);
    bg.fillStyle = 'rgb(128,128,128)';
    bg.fillRect(0, 0, size, size);

    const step = 128;
    for (let x = 0; x < size; x += step) {
      for (let y = 0; y < size; y += step) {
        ag.strokeStyle = '#121c21';
        ag.lineWidth = 4;
        ag.strokeRect(x + 2, y + 2, step - 4, step - 4);
        bg.strokeStyle = 'rgb(65,65,65)';
        bg.lineWidth = 4;
        bg.strokeRect(x + 2, y + 2, step - 4, step - 4);

        ag.strokeStyle = 'rgba(165, 210, 220, 0.16)';
        bg.strokeStyle = 'rgb(178,178,178)';
        ag.lineWidth = 1.5;
        bg.lineWidth = 1.5;
        for (let k = 12; k < step - 12; k += 10) {
          ag.beginPath(); ag.moveTo(x + k, y + 12); ag.lineTo(x + 12, y + k); ag.stroke();
          bg.beginPath(); bg.moveTo(x + k, y + 12); bg.lineTo(x + 12, y + k); bg.stroke();
        }
      }
    }

    // Charcos brillantes que reflejan la luz naranja del fondo
    for (let i = 0; i < 20; i++) {
      const px = Math.random() * size;
      const py = Math.random() * size;
      const rad = 22 + Math.random() * 48;
      rg.fillStyle = i % 2 === 0 ? 'rgb(24,24,24)' : 'rgb(135,135,135)';
      rg.beginPath();
      rg.arc(px, py, rad, 0, Math.PI * 2);
      rg.fill();
    }

    const map = new THREE.CanvasTexture(albedo);
    const roughnessMap = new THREE.CanvasTexture(rough);
    const bumpMap = new THREE.CanvasTexture(bump);
    [map, roughnessMap, bumpMap].forEach((t) => {
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(4, 12);
    });

    const mat = new THREE.MeshStandardMaterial({
      map,
      roughnessMap,
      bumpMap,
      bumpScale: QUALITY_PRESETS[currentQuality].bumpScale,
      roughness: 0.88,
      metalness: 0.62
    });
    pbrMaterials.push(mat);
    return mat;
  }

  function createBrickAndConcreteWall() {
    const size = 256;
    const albedo = document.createElement('canvas');
    const bump = document.createElement('canvas');
    albedo.width = bump.width = size;
    albedo.height = bump.height = size;

    const ag = albedo.getContext('2d');
    const bg = bump.getContext('2d');
    ag.fillStyle = '#293b42';
    ag.fillRect(0, 0, size, size);
    bg.fillStyle = 'rgb(128,128,128)';
    bg.fillRect(0, 0, size, size);

    // Franja inferior de ladrillo/concreto con relieve
    for (let row = 0; row < 8; row++) {
      const y = row * 16;
      ag.fillStyle = row % 2 === 0 ? '#364950' : '#2f4047';
      ag.fillRect(0, y, size, 14);
      bg.fillStyle = 'rgb(165,165,165)';
      bg.fillRect(0, y, size, 14);
    }

    // Manchas y grietas
    for (let i = 0; i < 40; i++) {
      ag.fillStyle = 'rgba(10, 18, 22, 0.22)';
      ag.fillRect(Math.random() * size, Math.random() * size, 16 + Math.random() * 28, 6 + Math.random() * 14);
    }

    const map = new THREE.CanvasTexture(albedo);
    const bumpMap = new THREE.CanvasTexture(bump);
    [map, bumpMap].forEach((t) => {
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(6, 2);
    });

    const mat = new THREE.MeshStandardMaterial({
      map,
      bumpMap,
      bumpScale: QUALITY_PRESETS[currentQuality].bumpScale,
      roughness: 0.72,
      metalness: 0.25
    });
    pbrMaterials.push(mat);
    return mat;
  }

  function createZombieTexture(seed) {
    const size = 256;
    const albedo = document.createElement('canvas');
    const bump = document.createElement('canvas');
    albedo.width = bump.width = size;
    albedo.height = bump.height = size;

    const ag = albedo.getContext('2d');
    const bg = bump.getContext('2d');
    ag.fillStyle = seed % 2 === 0 ? '#536259' : '#63564c';
    ag.fillRect(0, 0, size, size);
    bg.fillStyle = 'rgb(128,128,128)';
    bg.fillRect(0, 0, size, size);

    // Heridas/manchas oscuras y pliegues de ropa/piel
    for (let i = 0; i < 36; i++) {
      ag.fillStyle = i % 3 === 0 ? 'rgba(115, 28, 24, 0.42)' : 'rgba(22, 26, 24, 0.35)';
      ag.beginPath();
      ag.arc(Math.random() * size, Math.random() * size, 4 + Math.random() * 16, 0, Math.PI * 2);
      ag.fill();

      bg.fillStyle = i % 2 === 0 ? 'rgb(168,168,168)' : 'rgb(88,88,88)';
      bg.fillRect(Math.random() * size, Math.random() * size, 12, 4);
    }

    const map = new THREE.CanvasTexture(albedo);
    const bumpMap = new THREE.CanvasTexture(bump);
    const mat = new THREE.MeshStandardMaterial({
      map,
      bumpMap,
      bumpScale: QUALITY_PRESETS[currentQuality].bumpScale,
      roughness: 0.76,
      metalness: 0.08
    });
    pbrMaterials.push(mat);
    return mat;
  }

    const group = new THREE.Group();
    const mat = createZombieTexture(seed);

    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.08, 0.78, 12), mat);
    legL.position.set(-0.14, 0.39, 0);
    legL.castShadow = true;

    legR.position.set(0.14, 0.39, 0);

    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.19, 0.66, 14), mat);
    torso.position.set(0, 1.08, 0);
    torso.rotation.x = isRunner ? 0.3 : 0.12;
    torso.castShadow = true;

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), mat);
    head.position.set(0, 1.56, isRunner ? 0.14 : 0.05);
    head.castShadow = true;

    armL.position.set(-0.28, 1.24, 0.22);
    armL.rotation.x = -Math.PI / 2.25;

    const armR = armL.clone();
    armR.position.set(0.28, 1.24, 0.22);

    group.add(legL, legR, torso, head, armL, armR);
    return { group, legL, legR, armL, armR };
  }

  function getMapTitle(day) {
    const sector = Math.floor((day - 1) / 5) + 1;
    if (sector === 1) return 'DÍAS 1–5 · SECTOR DE CONTENCIÓN';
    return `DÍAS ${(sector - 1) * 5 + 1}–${sector * 5} · NIVEL ${sector}`;
  }

  function applySettings() {
    const p = QUALITY_PRESETS[currentQuality];
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, p.pixelRatio));
    renderer.shadowMap.enabled = p.shadows;
    renderer.toneMappingExposure = p.exposure;
    topSpot.shadow.mapSize.set(p.shadowRes, p.shadowRes);
    if (topSpot.shadow.map) {
      topSpot.shadow.map.dispose();
      topSpot.shadow.map = null;
    }
    fog.density = p.fogDensity;
    pbrMaterials.forEach((m) => { if (m.bumpMap) m.bumpScale = p.bumpScale; });
    resize();
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        quality: currentQuality,
        sensitivity: lookSensitivity
      }));
    } catch (_) {}
    applySettings();
    syncOptionsUI();

  function updateHud() {
    const w = WEAPONS[state.weaponKey];
    const hpPct = Math.max(0, Math.round(state.perimeterHp));

    document.getElementById('map-label').textContent = getMapTitle(state.day);
    document.getElementById('barricade-fill').style.width = `${hpPct}%`;
    document.getElementById('barricade-label').textContent = `PERÍMETRO ${hpPct}%`;
    document.getElementById('day-label').textContent = `DÍA ${state.day}`;
    document.getElementById('morale-fill').style.width = `${morPct}%`;
    document.getElementById('horde-label').textContent =
      `HORDA: ${state.hordeLeft + state.zombies.length} · BAJAS: ${state.kills}`;
    document.getElementById('weapon-name').textContent = w.name;
    document.getElementById('ammo-count').textContent = state.reloading ? 'REC...' : `${state.ammo} / ∞`;
  }

  function startNewGame() {
    audio.unlock();
    for (const z of state.zombies) scene.remove(z.group);
    state.zombies = [];

    state.day = 1;
    state.hordeLeft = 100;
    state.kills = 0;
    state.perimeterHp = 100;
    state.morale = 88;
    state.weaponKey = 'glock';
    state.ammo = WEAPONS.glock.magSize;
    state.reloading = false;
    state.yaw = 0;
    state.pitch = 0;

    showBanner('DÍA 1 · HORDA DE 100 INFECTADOS');

  function advanceDay() {
    const prevSector = Math.floor((state.day - 1) / 5);
    state.day++;
    const nextSector = Math.floor((state.day - 1) / 5);
    state.hordeLeft = 100 + (state.day - 1) * 15;
    state.perimeterHp = Math.min(100, state.perimeterHp + 30);
    state.morale = Math.min(100, state.morale + 15);

    if (nextSector !== prevSector) {
      const tint = nextSector % 2 === 1 ? 0x152b28 : 0x182933;
      scene.background.setHex(tint);
      fog.color.setHex(tint);
      showBanner(`NUEVO MAPA · ${getMapTitle(state.day)}`);
    } else {
      showBanner(`DÍA ${state.day} · HORDA DE ${state.hordeLeft}`);
    }
    updateHud();
  }

  function spawnZombie() {
    if (state.hordeLeft <= 0) return;
    state.hordeLeft--;
    const laneIdx = state.hordeLeft % 3;
    const isRunner = Math.random() < 0.42;
    const zMesh = createZombieUnit(isRunner, state.hordeLeft);
    zMesh.group.position.set(
      LANES_X[laneIdx] + (Math.random() - 0.5) * 0.55,
      0,
      -14.2 - Math.random() * 1.4
    );
    scene.add(zMesh.group);

    state.zombies.push({
      ...zMesh,
      isRunner,
      hp: isRunner ? 52 : 92,
      speed: isRunner ? (3.2 + Math.random() * 0.65) : (1.3 + Math.random() * 0.35),
      phase: Math.random() * Math.PI * 2,
      atkTimer: 0
    });
  }

  function startReload() {
    const w = WEAPONS[state.weaponKey];
    if (state.reloading || state.ammo === w.magSize || state.mode !== 'playing') return;
    state.reloading = true;
    state.reloadTimer = w.reloadTime;
    audio.playReload();
    updateHud();
  }

  function switchWeapon() {
    if (state.mode !== 'playing') return;
    state.weaponKey = state.weaponKey === 'glock' ? 'scar' : 'glock';
    state.reloading = false;
    state.ammo = WEAPONS[state.weaponKey].magSize;
    fpWeapon.pistol.visible = state.weaponKey === 'glock';
    fpWeapon.scar.visible = state.weaponKey === 'scar';
    audio.playReload();
    updateHud();
  }

  const raycaster = new THREE.Raycaster();

  function fireWeapon() {
    if (state.mode !== 'playing' || state.reloading) return;
    const w = WEAPONS[state.weaponKey];
    if (state.ammo <= 0) {
      startReload();
      return;
    }

    state.fireTimer = w.fireInterval;
    state.ammo--;
    state.recoil = 1.0;
    muzzleLight.intensity = 5.2;
    updateHud();

    if (state.weaponKey === 'glock') audio.playGlock();
    else audio.playScar();

    raycaster.setFromCamera(state.aimNDC, camera);
    let bestZ = null;
    let bestDist = Infinity;
    let isHead = false;

    for (const z of state.zombies) {
      const center = z.group.position.clone().add(new THREE.Vector3(0, 1.05, 0));
      if (raycaster.ray.distanceSqToPoint(center) < 0.36) {
        const d = camera.position.distanceTo(center);
        if (d < bestDist) {
          bestDist = d;
          bestZ = z;
          const headPos = z.group.position.clone().add(new THREE.Vector3(0, 1.56, 0));
          isHead = raycaster.ray.distanceSqToPoint(headPos) < 0.13;
        }
      }
    }

    if (bestZ) {
      bestZ.hp -= w.damage * (isHead ? 2.2 : 1.0);
      audio.playHit(isHead);
      if (bestZ.hp <= 0) {
        state.kills++;
        state.morale = Math.min(100, state.morale + (isHead ? 4 : 2));
        scene.remove(bestZ.group);
        state.zombies = state.zombies.filter((item) => item !== bestZ);
        updateHud();
      }
    }

    if (state.ammo === 0) startReload();
  }

  /* Joysticks táctiles: Moverse + Girar Cámara */
  function readPadVector(padEl, knobEl, clientX, clientY, outVec) {
    const r = padEl.getBoundingClientRect();
    const cx = r.left + r.width * 0.5;
    const cy = r.top + r.height * 0.5;
    const maxR = r.width * 0.42;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
    outVec.x = dx / maxR;
    outVec.y = dy / maxR;
  }

  function resetPad(knobEl, outVec) {
    knobEl.style.transform = 'translate(0px, 0px)';
    outVec.x = 0;
    outVec.y = 0;
  }

  const movePad = document.getElementById('move-pad');
  const moveKnob = document.getElementById('move-knob');
  const lookPad = document.getElementById('look-pad');
  const lookKnob = document.getElementById('look-knob');

  movePad.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    audio.unlock();
    state.movePointerId = e.pointerId;
    readPadVector(movePad, moveKnob, e.clientX, e.clientY, state.moveVec);
  });

  lookPad.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    audio.unlock();
    state.lookPointerId = e.pointerId;
    readPadVector(lookPad, lookKnob, e.clientX, e.clientY, state.lookVec);
  });

  threeCanvas.addEventListener('pointerdown', (e) => {
    audio.unlock();
    if (state.mode !== 'playing') return;
    state.aimScreen.x = e.clientX;
    state.aimScreen.y = e.clientY;
    state.aimScreen.active = true;
    const rect = threeCanvas.getBoundingClientRect();
    state.aimNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    state.aimNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    fireWeapon();
  });

  window.addEventListener('pointermove', (e) => {
    if (e.pointerId === state.movePointerId) {
      readPadVector(movePad, moveKnob, e.clientX, e.clientY, state.moveVec);
    }
    if (e.pointerId === state.lookPointerId) {
      readPadVector(lookPad, lookKnob, e.clientX, e.clientY, state.lookVec);
    }
  });

  function releasePointer(e) {
    if (e.pointerId === state.movePointerId) {
      state.movePointerId = null;
      resetPad(moveKnob, state.moveVec);
    }
    if (e.pointerId === state.lookPointerId) {
      state.lookPointerId = null;
      resetPad(lookKnob, state.lookVec);
    }
  }

  window.addEventListener('pointerup', releasePointer);
  window.addEventListener('pointercancel', releasePointer);

  const btnFire = document.getElementById('btn-fire');
  btnFire.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    audio.unlock();
    state.firingHeld = true;
    fireWeapon();
  });
  window.addEventListener('pointerup', () => { state.firingHeld = false; });

  async function toggleFullScreen() {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  }

  document.getElementById('btn-new').addEventListener('click', startNewGame);
  document.getElementById('retry-btn').addEventListener('click', startNewGame);
  document.getElementById('btn-options').addEventListener('click', () => {
    audio.unlock();
    syncOptionsUI();
    document.getElementById('options-panel').classList.add('visible');
  });
  document.getElementById('btn-options-back').addEventListener('click', () => {
    saveSettings();
    document.getElementById('options-panel').classList.remove('visible');
  });
  document.querySelectorAll('.q-btn').forEach((b) => {
    b.addEventListener('click', () => {
      currentQuality = b.dataset.q;
      saveSettings();
    });
  });
  document.getElementById('sens-slider').addEventListener('input', (e) => {
    lookSensitivity = parseFloat(e.target.value) || 1.0;
    document.getElementById('sens-value-label').textContent =
      `SENSIBILIDAD JOYSTICK CÁMARA: ${lookSensitivity.toFixed(1)}x`;
  });
  document.getElementById('btn-fullscreen').addEventListener('click', toggleFullScreen);
  document.getElementById('btn-fs-hud').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFullScreen();
  });
  document.getElementById('btn-exit').addEventListener('click', () => {
    try { window.close(); } catch (_) {}
    showBanner('SESIÓN CERRADA');
  });
  document.getElementById('btn-menu-hud').addEventListener('click', (e) => {
    e.stopPropagation();
    state.mode = 'menu';
    document.getElementById('game-root').classList.remove('gameplay-active');
    document.getElementById('main-menu').classList.remove('hidden');
  });
  document.getElementById('btn-reload').addEventListener('click', (e) => {
    e.stopPropagation();
    startReload();
  });
  document.getElementById('btn-weapon').addEventListener('click', (e) => {
    e.stopPropagation();
    switchWeapon();
  });
  document.getElementById('end-to-menu').addEventListener('click', () => {
    state.mode = 'menu';
    document.getElementById('end-overlay').classList.remove('visible');
    document.getElementById('game-root').classList.remove('gameplay-active');
    document.getElementById('main-menu').classList.remove('hidden');
  });

  window.addEventListener('resize', resize);
  syncOptionsUI();
  applySettings();

  let lastTs = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;
    state.elapsed += dt;

    fireLight.intensity = 9.5 + Math.sin(state.elapsed * 14) * 1.6;
    flames.forEach((f) => {
      f.mesh.scale.y = 0.8 + Math.sin(state.elapsed * 16 + f.phase) * 0.25;
      f.mesh.position.y = f.baseY + Math.sin(state.elapsed * 12 + f.phase) * 0.12;
    });

    muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 45);
    state.recoil = Math.max(0, state.recoil - dt * 8.5);

    if (state.mode === 'playing') {
      audio.playGroan(state.elapsed);

      // Movimiento con joystick izquierdo
      const moveSpeed = 4.2;
      camera.position.x += state.moveVec.x * moveSpeed * dt;
      camera.position.z += state.moveVec.y * moveSpeed * dt;
      camera.position.x = Math.max(-4.1, Math.min(4.1, camera.position.x));
      camera.position.z = Math.max(-9.5, Math.min(7.8, camera.position.z));

      // Giro de cámara con joystick derecho y sensibilidad configurable
      const turnSpeed = 1.65 * lookSensitivity;
      state.yaw -= state.lookVec.x * turnSpeed * dt;
      state.pitch -= state.lookVec.y * turnSpeed * 0.75 * dt;
      state.yaw = Math.max(-0.85, Math.min(0.85, state.yaw));
      state.pitch = Math.max(-0.45, Math.min(0.45, state.pitch));

      camera.rotation.order = 'YXZ';
      camera.rotation.y = state.yaw;
      camera.rotation.x = state.pitch + state.recoil * 0.025;

      // Retroceso y recarga del arma
      fpWeapon.slide.position.z = -0.05 + state.recoil * 0.035;
      fpWeapon.rig.position.z = -0.44 + state.recoil * 0.04;
      fpWeapon.rig.position.y = -0.24 + Math.sin(state.elapsed * 3.8) * 0.005;

      if (state.reloading) {
        state.reloadTimer -= dt;
        fpWeapon.rig.rotation.z = 0.42;
        fpWeapon.rig.position.y = -0.34;
        if (state.reloadTimer <= 0) {
          state.reloading = false;
          fpWeapon.rig.rotation.z = 0;
          state.ammo = WEAPONS[state.weaponKey].magSize;
          updateHud();
        }
      } else {
        fpWeapon.rig.rotation.z = 0;
      }

      state.fireTimer = Math.max(0, state.fireTimer - dt);
      if (state.firingHeld && state.fireTimer <= 0) {
        fireWeapon();
      }

      if (state.hordeLeft > 0) {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnZombie();
          state.spawnTimer = Math.max(0.24, 0.72 - state.day * 0.03);
        }
      } else if (state.zombies.length === 0) {
        advanceDay();
      }

      for (const z of state.zombies) {
        z.phase += dt * (z.isRunner ? 12 : 6.5);
        if (z.group.position.z < camera.position.z - 1.35) {
          z.group.position.z += z.speed * dt;
          z.legL.rotation.x = Math.sin(z.phase) * 0.5;
          z.legR.rotation.x = -Math.sin(z.phase) * 0.5;
        } else {
          z.atkTimer -= dt;
          z.armL.rotation.x = -1.1 + Math.sin(z.phase * 1.4) * 0.45;
          if (z.atkTimer <= 0) {
            z.atkTimer = 1.0;
            state.perimeterHp = Math.max(0, state.perimeterHp - (z.isRunner ? 5 : 3.5));
            state.morale = Math.max(0, state.morale - 2.5);
            updateHud();
            if (state.perimeterHp <= 0) {
              state.mode = 'gameover';
              document.getElementById('end-stats').innerHTML =
                `Sobreviviste hasta <b>DÍA ${state.day}</b> · Bajas: <b>${state.kills}</b>`;
              document.getElementById('end-overlay').classList.add('visible');
              break;
            }
          }
        }
      }
    } else {
      camera.rotation.y = Math.sin(state.elapsed * 0.35) * 0.05;
    }

    renderer.render(scene, camera);

    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    if (state.mode === 'playing' && state.aimScreen.active) {
      const cx = state.aimScreen.x;
      const cy = state.aimScreen.y;
      const g = 6 + state.recoil * 6;
      const l = 9;
      fxCtx.strokeStyle = 'rgba(130, 238, 226, 0.92)';
      fxCtx.lineWidth = 1.8;
      fxCtx.beginPath();
      fxCtx.moveTo(cx - g - l, cy); fxCtx.lineTo(cx - g, cy);
      fxCtx.moveTo(cx + g, cy); fxCtx.lineTo(cx + g + l, cy);
      fxCtx.moveTo(cx, cy - g - l); fxCtx.lineTo(cx, cy - g);
      fxCtx.moveTo(cx, cy + g); fxCtx.lineTo(cx, cy + g + l);
      fxCtx.stroke();
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
